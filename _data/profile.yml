short_bio_text_justify: false
short_bio: >-
  <p>
    I spend most of my time staring at street-view images (SVIs), trying to figure out what they can tell us about
    cities. Currently, I work as a researcher at <a href="https://frontiers.ui.ac.id/sparc/" target="_blank">SPARC</a>, Department of Geography, Universitas Indonesia, 
    somewhere between computer vision, urban geography, and spatial approaches with a soft spot for <strong>SVI applications</strong>, <strong>streetscapes</strong>, and the
    small visual details that make a street feel like a place.
  </p>
  <p>
    I studied Geography at Universitas Indonesia for both my <u>B.Sc. and M.Sc. (fast-track program)</u>, focusing on <strong>urban context</strong>
    research</strong>. I've had the chance to teach a bit, mentor some undergraduate students, and write papers on things
    like green space equity and street-view applications in urban context research. Most days I'm still learning as I go, which I think is
    the fun part.
  </p>
  <p>
    These days, I'm chasing a fun question: <u>when you ask AI to make a street "more sustainable," what does it
    actually change?</u> My <a href="https://aditpradana36.github.io/prompting_sustainability/" target="_blank">latest project</a>
    compares real streets in Jakarta, Melbourne, and Singapore against AI-reimagined versions of themselves — turns
    out the models have some strong (<strong>and surprisingly similar</strong>) opinions about what "sustainable" should look like,
    no matter which city you're in (at least from those 3 cities). Alongside that, I'm also working on
    <a href="https://aditpradana36.github.io/cooling_cities/" target="_blank">Cooling Cities, Warming Communities</a>,
    which looks at how green Jakarta's parks really are, and how much people actually feel that coolness in daily life not only presented by maps, but the experience it self.
  </p>

